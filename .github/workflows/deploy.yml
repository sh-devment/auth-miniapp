name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.region }}
    runs-on: [self-hosted, "production-${{ matrix.region }}"]
    environment: production-${{ matrix.region }}

    strategy:
      fail-fast: false
      matrix:
        # Пока только com. Код к ru готов (build/region-ru.go проверяется на
        # каждом старте), так что включить ru — это дописать его сюда и
        # завести environment production-ru с теми же vars/secrets.
        region: [com]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          # Имя приложения: repo-level variable, задаётся вручную (обязательно).
          APP: ${{ vars.APP }}
          # Какие переменные записать в $APP.env (всё ниже в этом блоке).
          ENV_KEYS: REGION PORT BOT_TOKEN AUTH_INTERNAL APP_URL

          # Регион наследуется из matrix — отдельно заводить не нужно.
          # По нему бинарь выбирает язык страницы и приветствие бота
          # (build/region-ru.go / region-com.go); незнакомое значение валит
          # старт, health check и откатывает деплой.
          REGION: ${{ matrix.region }}
          PORT: ${{ vars.PORT }}
          # Тот же бот, что у auth-center этой зоны: из токена обе стороны
          # выводят общий секрет.
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AUTH_INTERNAL: ${{ vars.AUTH_INTERNAL }}
          # Публичный адрес мини-аппа: включает бот-половину (webhook).
          APP_URL: ${{ vars.APP_URL }}
        run: ./bin/deploy.sh
